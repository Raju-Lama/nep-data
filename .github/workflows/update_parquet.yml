name: NEPSE Daily Data

on:
  schedule:
    - cron: "15 10 * * 0-4"   # 4:15 PM NPT = 10:15 UTC, Sun–Thu
  workflow_dispatch:


permissions:
  contents: write   # 👈 allow pushing commits


jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                     # ← ADD THIS LINE
          persist-credentials: true          # ← ADD THIS LINE

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas pyarrow requests playwright
          python -m playwright install --with-deps chromium

      - name: Fetch active symbols
        run: python active_stocks_scraper.py

      - name: Update OHLCV Parquet
        run: python update_parquet.py

      - name: Convert Parquet to JSON
        run: |
          python - <<'EOF'
          import pandas as pd
          import json
          df = pd.read_parquet("ohlcv.parquet")

          # Compact JSON (fast & small)
          df.to_json("ohlcv.json", orient="records", date_format="iso")

          # Pretty JSON (easier for humans to browse)
          records = df.to_dict(orient="records")
          with open("ohlcv_pretty.json", "w") as f:
              json.dump(records, f, indent=2)
          EOF

      - name: Split Parquet into per-symbol JSON (API style)
        run: |
          mkdir -p json
          python - <<'EOF'
          import pandas as pd
          import json
          import re

          from pathlib import Path
          import time

          df = pd.read_parquet("ohlcv.parquet")

          outdir = Path("json")
          outdir.mkdir(exist_ok=True)

          for sym, sdf in df.groupby("symbol"):
              sdf = sdf.sort_values("date")
              data = {
                  "s": "ok",
                  "t": [int(time.mktime(d.timetuple())) for d in pd.to_datetime(sdf["date"])],
                  "o": sdf["open"].astype(float).tolist(),
                  "h": sdf["high"].astype(float).tolist(),
                  "l": sdf["low"].astype(float).tolist(),
                  "c": sdf["close"].astype(float).tolist(),
                  "v": sdf["volume"].astype(int).tolist(),
              }
      
          safe_sym = re.sub(r'[\\/]', '_', sym)         # replace any slash or backslash
          filename = outdir / f"{safe_sym}.json"
          filename.write_text(json.dumps(data))
          print(f"✅ Exported {len(df['symbol'].unique())} symbol files")
          EOF


      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add all_active_symbols.csv ohlcv.parquet ohlcv.json ohlcv_pretty.json json/
          git diff --cached --quiet || git commit -m "Daily NEPSE update"
          git pull --rebase origin main      # fail if conflicts
          git push origin HEAD:main