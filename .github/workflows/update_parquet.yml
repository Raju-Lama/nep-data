name: NEPSE Daily Data

on:
  schedule:
    - cron: "15,30,45 5 * * 0-4" # 11:00, 11:15, 11:30 NPT (Sun–Thu)
    - cron: "*/15 6-8 * * 0-4"   # 11:45–14:45 NPT (Sun–Thu)
    - cron: "0,15 9 * * 0-4"     # 14:45, 15:00 NPT (Sun–Thu)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Check NEPSE market hours (NPT)
        run: |
          DOW="$(TZ=Asia/Kathmandu date +%u)"   # 1=Mon ... 7=Sun
          HM="$(TZ=Asia/Kathmandu date +%H%M)"  # 24h local time

          if [ "$DOW" -eq 5 ] || [ "$DOW" -eq 6 ]; then
            echo "Market closed today (NPT). Skipping update."
            exit 0
          fi

          if [ "$HM" -lt 1100 ] || [ "$HM" -gt 1515 ]; then
            echo "Outside market hours (11:00-15:15 NPT). Skipping update."
            exit 0
          fi

          echo "Market is open (NPT). Proceeding with update."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests playwright
          python -m playwright install --with-deps chromium

      - name: Fetch active symbols
        run: python active_stocks_scraper.py

      - name: Update OHLCV Parquet
        run: python update_parquet.py

      - name: Convert Parquet to JSON
        run: |
          python - <<'EOF'
          import pandas as pd
          import json

          df = pd.read_parquet("ohlcv.parquet")

          df["date"] = pd.to_datetime(df["date"]).dt.strftime("%Y-%m-%d")

          df.to_json(
              "ohlcv.json",
              orient="records",
              date_format="iso"
          )

          records = df.to_dict(orient="records")

          with open("ohlcv_pretty.json", "w") as f:
              json.dump(records, f, indent=2)
          EOF

      - name: Split Parquet into per-symbol JSON
        run: |
          mkdir -p json

          python - <<'EOF'
          import pandas as pd
          import json
          from pathlib import Path

          df = pd.read_parquet("ohlcv.parquet")

          outdir = Path("json")
          outdir.mkdir(exist_ok=True)

          for sym, sdf in df.groupby("symbol"):
              sdf = sdf.copy()

              sdf["date"] = pd.to_datetime(sdf["date"])
              sdf = sdf.sort_values("date")

              t = (
                  pd.to_datetime(sdf["date"]).astype("int64") // 10**9
              ).tolist()

              data = {
                  "s": "ok",
                  "t": t,
                  "o": sdf["open"].astype(float).tolist(),
                  "h": sdf["high"].astype(float).tolist(),
                  "l": sdf["low"].astype(float).tolist(),
                  "c": sdf["close"].astype(float).tolist(),
                  "v": sdf["volume"].astype(int).tolist(),
              }

              safe_sym = sym.replace("/", "_").replace("\\", "_")

              (outdir / f"{safe_sym}.json").write_text(
                  json.dumps(data)
              )

          print(
              f"Exported {len(df['symbol'].unique())} symbol files"
          )
          EOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            all_active_symbols.csv \
            ohlcv.parquet \
            ohlcv.json \
            ohlcv_pretty.json \
            json/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Daily NEPSE update"

          git push origin main
